<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- tło (pełne dla maskable) -->
  <rect width="512" height="512" fill="#ffffff"/>
  <!-- karta kalendarza -->
  <rect x="16" y="16" width="480" height="480" rx="90" fill="#ffffff" stroke="#e5e5ea" stroke-width="3"/>

  <!-- pomarańczowy nagłówek z nazwą miesiąca -->
  <rect x="16" y="16" width="480" height="152" rx="90" fill="#ff9500"/>
  <rect x="16" y="106" width="480" height="62" fill="#ff9500"/>

  <!-- haczyki / kółka kalendarza -->
  <rect x="154" y="0" width="32" height="76" rx="16" fill="#cc7700"/>
  <rect x="326" y="0" width="32" height="76" rx="16" fill="#cc7700"/>

  <!-- nazwa miesiąca -->
  <text x="256" y="102"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="58" font-weight="700" fill="#ffffff"
        text-anchor="middle" dominant-baseline="middle"
        letter-spacing="3">LUT</text>

  <!-- duży numer dnia -->
  <text x="256" y="340"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="210" font-weight="200" fill="#1c1c1e"
        text-anchor="middle" dominant-baseline="middle">10</text>
</svg>
