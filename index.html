<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kalendarz-Dziennik</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dziennik">
<link rel="apple-touch-icon" href="./icons/icon.svg">

<!-- Czcionki -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#ff3b30;
    --red-soft:#fff2f1;
    --blue:#007aff;
    --blue-soft:#e8f2ff;
    --blue-hover:#0066dd;
    --green:#34c759;
    --green-soft:#e8f9ed;
    --green-hover:#248a3d;
    --bg:#f2f2f7;
    --card:#ffffff;
    --inset:#f2f2f7;
    --text:#1c1c1e;
    --muted:#8e8e93;
    --border:#e5e5ea;
    --border-strong:#c7c7cc;
    --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.07);
    --radius:14px;
    /* aliasy dla wstecznej zgodności */
    --accent:var(--blue);
    --accent-soft:var(--blue-soft);
    --accent-hover:var(--blue-hover);
    --teal:var(--green);
    --teal-soft:var(--green-soft);
    --teal-hover:var(--green-hover);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:900px;margin:0 auto;padding:20px 14px 80px}
  .app-header{
    display:flex;align-items:center;justify-content:center;
    margin-bottom:20px;
  }
  .app-title-tile{
    background:#1c1c1e;border-radius:14px;
    padding:10px 24px;display:inline-flex;align-items:center;
    box-shadow:0 2px 12px rgba(0,0,0,.18);
  }
  h1{
    font-size:1.5rem;font-weight:800;letter-spacing:.5px;
    color:#ff9500;margin:0;text-transform:uppercase;
  }

  /* ===== PRZEŁĄCZNIK WIDOKU ===== */
  .view-switch{
    display:flex;gap:2px;justify-content:center;margin-bottom:16px;
    background:var(--border);border-radius:11px;padding:3px;
    width:fit-content;margin-left:auto;margin-right:auto;
  }
  .view-switch button{
    border:none;background:transparent;color:var(--muted);
    padding:7px 18px;border-radius:9px;cursor:pointer;
    font-size:.88rem;font-weight:600;font-family:inherit;transition:all .15s;
  }
  .view-switch button.active{background:var(--card);color:var(--text);font-weight:700;
    box-shadow:0 1px 4px rgba(0,0,0,.12)}

  /* ===== NAGŁÓWEK NAWIGACJI ===== */
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
  .cal-title{font-size:1.15rem;font-weight:700;text-transform:capitalize;text-align:center;line-height:1.25;letter-spacing:-.2px}
  .cal-title small{display:block;font-size:.7rem;font-weight:500;color:var(--muted);text-transform:none}
  .nav-btn{
    border:none;background:transparent;width:38px;height:38px;border-radius:50%;
    font-size:1.3rem;cursor:pointer;color:var(--blue);
    display:flex;align-items:center;justify-content:center;transition:background .12s;flex:0 0 auto;
  }
  .nav-btn:hover{background:var(--blue-soft)}
  .today-btn{
    border:none;background:transparent;padding:0 10px;height:36px;border-radius:10px;cursor:pointer;
    font-size:.83rem;font-weight:600;color:var(--blue);font-family:inherit;transition:background .12s;
  }
  .today-btn:hover{background:var(--blue-soft)}

  /* ===== KARTA ===== */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}

  /* ===== MIESIĄC ===== */
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
  .weekday{
    text-align:center;font-size:.7rem;font-weight:600;
    color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:3px 0;
  }
  .weekday:last-child{color:var(--red)} /* Niedziela */
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .day{
    position:relative;min-height:82px;border-radius:10px;
    border:1px solid var(--border);background:var(--card);
    padding:5px 5px 4px;cursor:pointer;transition:all .12s;user-select:none;
    display:flex;flex-direction:column;gap:2px;overflow:hidden;
  }
  .day:hover{background:var(--blue-soft);border-color:var(--blue)}
  .day.empty{background:transparent;border-color:transparent;cursor:default}
  .day.empty:hover{background:transparent;border-color:transparent}
  .day.red-day .day-num-inner{color:var(--red)}
  .day-num{display:flex;align-items:center;justify-content:flex-start;padding:2px 2px 0}
  .day-num-inner{
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:.88rem;font-weight:600;
  }
  .day.today .day-num-inner{background:var(--red);color:#fff;font-weight:700}
  .day.selected:not(.today) .day-num-inner{background:var(--blue);color:#fff;font-weight:700}
  .day.selected.today .day-num-inner{background:var(--red);color:#fff}
  .day-events{display:flex;flex-direction:column;gap:2px;overflow:hidden;padding:0 2px}

  /* event chips */
  .ev-chip{
    font-size:.64rem;font-weight:600;line-height:1.3;
    padding:2px 5px;border-radius:4px;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer;transition:filter .12s;
  }
  .ev-chip:hover{filter:brightness(1.15)}
  .ev-more{font-size:.6rem;color:var(--muted);padding-left:2px}

  /* ===== MODAL ZDARZENIA ===== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;
    display:flex;align-items:center;justify-content:center;padding:20px;
    animation:fadeIn .15s ease;
  }
  .modal-overlay.hidden{display:none}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    background:var(--card);border-radius:18px;padding:24px;
    max-width:360px;width:100%;box-shadow:0 12px 48px rgba(0,0,0,.22);
    animation:slideUp .2s ease;
  }
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px}
  .modal-color-bar{width:5px;border-radius:3px;align-self:stretch;flex:0 0 5px}
  .modal-titles{flex:1}
  .modal-name{font-size:1.1rem;font-weight:700;letter-spacing:-.2px;line-height:1.3}
  .modal-date{font-size:.78rem;color:var(--muted);margin-top:2px}
  .modal-close{
    border:none;background:var(--inset);color:var(--muted);
    width:30px;height:30px;border-radius:50%;cursor:pointer;
    font-size:1.1rem;display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;transition:background .12s;
  }
  .modal-close:hover{background:var(--border-strong)}
  .modal-rows{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .modal-row{display:flex;align-items:center;gap:12px}
  .modal-ico{
    width:36px;height:36px;border-radius:10px;background:var(--inset);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:1.1rem;
  }
  .modal-info{font-size:.88rem}
  .modal-info strong{display:block;font-weight:600;color:var(--text)}
  .modal-info span{font-size:.74rem;color:var(--muted)}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end}
  /* lista wydarzeń w modalu */
  .modal-event-list{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto}
  .modal-ev-card{
    display:flex;gap:0;border-radius:12px;overflow:hidden;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .modal-ev-strip{width:5px;flex:0 0 5px}
  .modal-ev-body{
    flex:1;background:var(--inset);padding:11px 14px;
    display:flex;flex-direction:column;gap:3px;
  }
  .modal-ev-name{font-size:.95rem;font-weight:700;color:var(--text)}
  .modal-ev-meta{font-size:.76rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
  .modal-ev-del{
    border:none;background:transparent;color:var(--border-strong);
    padding:8px 10px;cursor:pointer;font-size:1rem;align-self:center;
    transition:color .12s;flex:0 0 auto;
  }
  .modal-ev-del:hover{color:var(--red)}
  .modal-empty{text-align:center;color:var(--muted);font-size:.88rem;padding:20px 0}

  /* ===== TYDZIEŃ ===== */
  .week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .week-day{
    border:1px solid var(--border);border-radius:12px;background:var(--card);
    padding:12px;cursor:pointer;transition:all .12s;min-height:110px;
    display:flex;flex-direction:column;gap:6px;
  }
  .week-day:hover{border-color:var(--blue);background:var(--blue-soft)}
  .week-day.today{border-color:var(--red);border-width:2px}
  .week-day-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
  .week-day-name{font-size:.72rem;font-weight:600;text-transform:uppercase;color:var(--muted);letter-spacing:.03em}
  .week-day-num{font-size:1.25rem;font-weight:700}
  .week-day.today .week-day-num{
    background:var(--red);color:#fff;border-radius:50%;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:1rem;
  }
  .week-day.red-day .week-day-name,.week-day.red-day .week-day-num{color:var(--red)}
  .week-day.today.red-day .week-day-num{color:#fff}
  .week-events{display:flex;flex-direction:column;gap:3px}
  .week-events .ev-chip{font-size:.72rem;padding:4px 8px;border-radius:6px}
  .week-empty{font-size:.75rem;color:var(--muted)}

  /* ===== WIDOK DNIA ===== */
  .panel{
    background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;
  }
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;gap:10px;flex-wrap:wrap;
  }
  .panel-head h2{font-size:1rem;font-weight:700;letter-spacing:-.2px}
  .panel-date{font-size:.78rem;color:var(--muted);text-transform:capitalize}
  .btn{
    border:none;background:var(--blue);color:#fff;
    padding:9px 16px;border-radius:10px;cursor:pointer;
    font-size:.84rem;font-weight:600;font-family:inherit;transition:background .15s;
  }
  .btn:hover{background:var(--blue-hover)}
  .btn.teal{background:var(--green)}
  .btn.teal:hover{background:var(--green-hover)}
  .btn.ghost{background:var(--card);color:var(--blue);border:1.5px solid var(--blue)}
  .btn.ghost:hover{background:var(--blue-soft)}
  .btn.small{padding:6px 12px;font-size:.8rem}

  /* ===== TIMELINE ===== */
  .timeline{position:relative;flex:1;min-height:400px;border-left:1px solid var(--border);margin-left:44px;margin-top:4px}
  .hour-row{position:relative;height:42px}
  .hour-label{position:absolute;left:-44px;top:-8px;width:38px;text-align:right;font-size:.67rem;font-weight:500;color:var(--muted)}
  .hour-line{position:absolute;left:0;right:0;top:0;border-top:1px solid var(--border)}
  .activities-layer{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
  .activity-block{
    position:absolute;left:6px;right:6px;border-radius:7px;
    padding:5px 9px;color:#fff;font-size:.76rem;overflow:hidden;
    pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.15);
    display:flex;flex-direction:column;justify-content:flex-start;
  }
  .activity-block .act-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .activity-block .act-meta{font-size:.67rem;font-weight:500;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .activity-block .act-del{
    position:absolute;top:3px;right:4px;cursor:pointer;
    background:rgba(0,0,0,.18);border-radius:50%;width:16px;height:16px;
    display:flex;align-items:center;justify-content:center;font-size:.78rem;line-height:1;
  }
  .activity-block .act-del:hover{background:rgba(0,0,0,.38)}
  .empty-hint{color:var(--muted);font-size:.82rem;text-align:center;padding:24px 10px}

  /* ===== FORMULARZ ===== */
  .form{background:var(--inset);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
  .form.hidden{display:none}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:.74rem;font-weight:600;color:var(--muted);margin-bottom:4px}
  .field input,.field select{
    width:100%;padding:9px 10px;border:1px solid var(--border-strong);
    border-radius:9px;font-size:.88rem;font-weight:500;font-family:inherit;
    background:var(--card);color:var(--text);
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .duration-badge{display:inline-block;background:var(--blue-soft);color:var(--blue-hover);padding:5px 10px;border-radius:8px;font-size:.78rem;font-weight:700}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

  /* ===== MIKROFON ===== */
  .mic-btn{
    flex:0 0 auto;width:38px;height:38px;border-radius:50%;
    border:1.5px solid var(--border-strong);background:var(--card);
    color:var(--muted);cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:all .15s;padding:0;
  }
  .mic-btn:hover{border-color:var(--blue);color:var(--blue)}
  .mic-btn.recording{background:#ff3b30;border-color:#ff3b30;color:#fff;animation:mic-pulse 1s ease-in-out infinite}
  .mic-btn.unsupported{opacity:.3;cursor:not-allowed}
  @keyframes mic-pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.5)}
    50%{box-shadow:0 0 0 8px rgba(255,59,48,0)}
  }
  .field-row{display:flex;gap:8px;align-items:center}
  .field-row input,.field-row select{flex:1;min-width:0}
  .mic-preview{font-size:.75rem;color:var(--muted);font-style:italic;min-height:16px;margin-top:3px;padding:0 2px;transition:color .2s}
  .mic-preview.active{color:var(--blue)}
  .voice-dictate-wrap{
    background:var(--blue-soft);border:1.5px solid var(--blue);
    border-radius:11px;padding:11px 13px;margin-bottom:12px;
    display:flex;flex-direction:column;gap:7px;
  }
  .voice-dictate-wrap label{font-size:.75rem;font-weight:700;color:var(--blue-hover)}
  .voice-dictate-row{display:flex;gap:8px;align-items:center}
  .voice-result-box{
    background:var(--card);border:1px solid var(--border);border-radius:8px;
    padding:8px 11px;font-size:.8rem;min-height:34px;flex:1;
    font-style:italic;color:var(--muted);
  }
  .voice-result-box.filled{font-style:normal;color:var(--text)}
  .voice-parsed{
    display:none;flex-direction:column;gap:4px;
    background:var(--card);border:1.5px solid var(--blue);
    border-radius:8px;padding:9px 11px;font-size:.78rem;
  }
  .voice-parsed.show{display:flex}
  .voice-parsed-row{display:flex;gap:6px;align-items:center}
  .voice-parsed-label{font-weight:700;color:var(--muted);min-width:55px}
  .voice-parsed-val{color:var(--text);font-weight:600}
  .voice-apply-btn{
    border:none;background:var(--blue);color:#fff;
    padding:7px 14px;border-radius:8px;cursor:pointer;
    font-size:.78rem;font-weight:700;font-family:inherit;
    margin-top:4px;align-self:flex-end;
  }

  /* ===== PWA ===== */
  .pwa-install-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:999;
    background:var(--blue);color:#fff;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 16px rgba(0,0,0,.15);font-family:inherit;
    transform:translateY(0);transition:transform .3s ease;
  }
  .pwa-install-bar.hidden{transform:translateY(120%)}
  .pwa-install-bar-text{display:flex;align-items:center;gap:10px;font-size:.92rem;font-weight:600}
  .pwa-install-bar-text svg{flex:0 0 32px}
  .pwa-install-bar-actions{display:flex;gap:8px;flex:0 0 auto}
  .pwa-install-bar .dismiss{
    background:transparent;border:1.5px solid rgba(255,255,255,.5);
    color:#fff;padding:7px 13px;border-radius:9px;cursor:pointer;
    font-size:.8rem;font-weight:600;font-family:inherit;
  }
  .pwa-install-bar .install{
    background:#fff;color:var(--blue);border:none;
    padding:7px 16px;border-radius:9px;cursor:pointer;
    font-size:.85rem;font-weight:700;font-family:inherit;
  }
  .pwa-install-bar .install:hover{background:var(--blue-soft)}

  /* ===== GŁÓWNE ZAKŁADKI (Kalendarz / Notatki) ===== */
  .main-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
  .main-tabs button{
    flex:1;max-width:210px;min-height:48px;border:none;border-radius:12px;
    background:var(--card);color:var(--muted);font-family:inherit;
    font-size:.95rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
    transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .main-tabs button.active{background:var(--blue);color:#fff}

  /* ikona notatki na kafelku dnia */
  .day-mic{margin-left:auto;font-size:.72rem;line-height:1;flex:0 0 auto}

  /* ===== ZAKŁADKA NOTATKI ===== */
  .notes-wrap{display:flex;flex-direction:column;gap:16px}
  .notes-rec-card{
    position:relative;background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:24px 18px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .notes-settings-btn{
    position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;
    border:none;background:var(--inset);color:var(--muted);cursor:pointer;
    font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:background .12s;
  }
  .notes-settings-btn:hover{background:var(--border-strong)}
  .notes-settings-btn.has-key{color:var(--green);background:var(--green-soft)}
  #recMicArea{display:flex;flex-direction:column;align-items:center;gap:8px}
  .rec-btn{
    width:104px;height:104px;border-radius:50%;border:none;cursor:pointer;
    background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 22px rgba(0,122,255,.35);transition:background .15s,transform .1s;
  }
  .rec-btn:hover{background:var(--blue-hover)}
  .rec-btn:active{transform:scale(.96)}
  .rec-btn svg{width:46px;height:46px}
  .rec-btn.recording{background:var(--red);animation:rec-pulse 1.3s ease-in-out infinite}
  .rec-btn.disabled{opacity:.35;cursor:not-allowed}
  @keyframes rec-pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.5)}
    50%{box-shadow:0 0 0 24px rgba(255,59,48,0)}
  }
  .rec-timer{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--red);display:none}
  .rec-timer.show{display:block}
  .rec-status{font-size:.9rem;font-weight:600;color:var(--muted);text-align:center;min-height:20px;padding:0 6px}
  .rec-status.live{color:var(--red)}
  .rec-status.warn{color:var(--red)}
  .rec-transcript{
    width:100%;background:var(--inset);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;font-size:.9rem;min-height:54px;color:var(--text);line-height:1.55;
    white-space:pre-wrap;word-break:break-word;
  }
  .rec-transcript.placeholder{color:var(--muted);font-style:italic}
  .rec-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
  .notes-fallback{width:100%}
  .notes-fallback textarea{
    width:100%;min-height:96px;padding:12px;border:1px solid var(--border-strong);
    border-radius:12px;font-family:inherit;font-size:.9rem;resize:vertical;
    background:var(--card);color:var(--text);
  }
  .notes-fallback textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
  .btn.danger{background:var(--red)}
  .btn.danger:hover{background:#d92c22}

  /* skeleton loader */
  .skeleton-card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;display:flex;flex-direction:column;gap:11px;
  }

<script>
/* ========================================================
   VOICE INPUT — Web Speech API
   ======================================================== */
class VoiceInput {
  constructor(lang='pl-PL'){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    this.supported = !!SR;
    if(!this.supported) return;
    this.rec = new SR();
    this.rec.lang = lang;
    this.rec.maxAlternatives = 1;
  }
  listen({ continuous=false, onInterim, onFinal, onEnd, onError }={}){
    if(!this.supported){ onError?.('Twoja przeglądarka nie obsługuje rozpoznawania mowy.'); return; }
    this.rec.continuous = continuous;
    this.rec.interimResults = !!onInterim;
    this.rec.onresult = e => {
      let interim='', final='';
      for(let i=e.resultIndex; i<e.results.length; i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) final += t;
        else interim += t;
      }
      if(interim) onInterim?.(interim);
      if(final)   onFinal?.(final);
    };
    this.rec.onerror = e => onError?.(e.error==='not-allowed'
      ? 'Brak dostępu do mikrofonu. Zezwól w ustawieniach przeglądarki.'
      : 'Błąd mikrofonu: '+e.error);
    this.rec.onend = () => onEnd?.();
    this.rec.start();
  }
  stop(){ try{ this.rec?.stop(); }catch(e){} }
}

/* ========================================================
   PARSER POLSKICH KOMEND GŁOSOWYCH
   ======================================================== */
const _VI = (()=>{
  const H = {
    'zero':0,'północ':0,'pierwsza':1,'druga':2,'trzecia':3,'czwarta':4,
    'piąta':5,'szósta':6,'siódma':7,'ósma':8,'dziewiąta':9,'dziesiąta':10,
    'jedenasta':11,'dwunasta':12,'trzynasta':13,'czternasta':14,'piętnasta':15,
    'szesnasta':16,'siedemnasta':17,'osiemnasta':18,'dziewiętnasta':19,
    'dwudziesta':20,'dwudziesta pierwsza':21,'dwudziesta druga':22,'dwudziesta trzecia':23
  };
  const M = {
    'zero':0,'pięć':5,'dziesięć':10,'kwadrans':15,'piętnaście':15,
    'dwadzieścia':20,'dwadzieścia pięć':25,'pół':30,'trzydzieści':30,
    'trzydzieści pięć':35,'czterdzieści':40,'czterdzieści pięć':45,
    'pięćdziesiąt':50,'pięćdziesiąt pięć':55
  };
  const CAT_MAP = {
    'praca':['praca','pracy','pracę','służbowe'],'Sport':['sport','sportu','trening','siłownia','bieganie','rower','basen'],
    'Nauka':['nauka','nauki','uczenie','kurs','lekcja','szkoła','studia'],
    'Spotkanie':['spotkanie','spotkania','meeting','zebranie','wizyta'],'Inne':[]
  };
  const PAD = n => String(n).padStart(2,'0');

  function extractTime(text){
    // cyfry: "10:30", "10.30", "1030"
    let m = text.match(/\b(\d{1,2})[:\.](\d{2})\b/);
    if(m) return PAD(m[1])+':'+PAD(m[2]);
    m = text.match(/\b([01]?\d|2[0-3])(\d{2})\b/);
    if(m) return PAD(m[1])+':'+PAD(m[2]);
    // słowa — godziny dwuczłonowe najpierw
    const sortedH = Object.keys(H).sort((a,b)=>b.length-a.length);
    for(const hName of sortedH){
      if(text.includes(hName)){
        const after = text.slice(text.indexOf(hName)+hName.length).trim();
        const sortedM = Object.keys(M).sort((a,b)=>b.length-a.length);
        for(const mName of sortedM){
          if(after.startsWith(mName)) return PAD(H[hName])+':'+PAD(M[mName]);
        }
        return PAD(H[hName])+':00';
      }
    }
    return null;
  }

  function extractAllTimes(text){
    const times=[];
    let s=text;
    for(let i=0;i<2;i++){
      const t=extractTime(s); if(!t) break;
      times.push(t);
      // usuń dopasowany fragment żeby znaleźć drugi czas
      const sortedH=Object.keys(H).sort((a,b)=>b.length-a.length);
      for(const hName of sortedH){
        const idx=s.indexOf(hName);
        if(idx!==-1){ s=s.slice(idx+hName.length); break; }
      }
      const dm=s.match(/\b(\d{1,2})[:\.](\d{2})\b/);
      if(dm) s=s.slice(s.indexOf(dm[0])+dm[0].length);
    }
    return times;
  }

  function extractCategory(text){
    const lo=text.toLowerCase();
    for(const [cat, words] of Object.entries(CAT_MAP)){
      if(words.some(w=>lo.includes(w))) return cat;
    }
    return 'Inne';
  }

  function extractName(text, cat, times){
    let s=text.toLowerCase();
    // usuń słowa kategorii
    const catWords = Object.values(CAT_MAP).flat();
    catWords.forEach(w=>{ s=s.replace(new RegExp('\\b'+w+'\\b','gi'),''); });
    // usuń godziny (słowne i cyfrowe)
    Object.keys(H).sort((a,b)=>b.length-a.length).forEach(h=>{ s=s.replace(new RegExp('\\b'+h+'\\b','gi'),''); });
    Object.keys(M).sort((a,b)=>b.length-a.length).forEach(m=>{ s=s.replace(new RegExp('\\b'+m+'\\b','gi'),''); });
    s=s.replace(/\b(\d{1,2})[:\.](\d{2})\b/g,'');
    s=s.replace(/\b(od|do|godzina|godz|przez)\b/gi,'');
    s=s.replace(/\s+/g,' ').trim();
    // Capitalize
    return s.charAt(0).toUpperCase()+s.slice(1) || 'Aktywność';
  }

  return { extractTime, extractAllTimes, extractCategory, extractName };
})();

function parseActivityVoice(text){
  const times = _VI.extractAllTimes(text.toLowerCase());
  const cat   = _VI.extractCategory(text);
  const name  = _VI.extractName(text, cat, times);
  return { name, cat, start: times[0]||'08:00', end: times[1]||'09:00' };
}

/* ======================================================== */

/* ========================================================
   NOTATKI GŁOSOWE — moduł VN
   Nagrywanie (Web Speech API) → analiza Claude → localStorage
   Definiowany PRZED kalendarzem, bo kalendarz używa VN.forDate()
   ======================================================== */
const VN = (function(){
  "use strict";

  const STORE_KEY = "voice-notes-v1";
  const APIKEY_KEY = "claude-api-key";
  const MODEL = "claude-sonnet-4-6";   // poprzedni claude-sonnet-4-20250514 został wycofany (404)
  const MAX_REC_MS = 125000;            // bezpiecznik ~2 min
  const CATEGORIES = [
    "📋 Zadania","📅 Spotkania","📈 Trading",
    "🏛️ Samorząd","💡 Pomysły","🛒 Do zrobienia","📝 Inne"
  ];

  /* ---- dane ---- */
  function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ return []; } }
  function persist(){ localStorage.setItem(STORE_KEY, JSON.stringify(notes)); }
  let notes = load();
  let activeFilter = "all";

  function getApiKey(){ return (localStorage.getItem(APIKEY_KEY) || "").trim(); }
  function setApiKey(k){ k=(k||"").trim(); if(k) localStorage.setItem(APIKEY_KEY,k); else localStorage.removeItem(APIKEY_KEY); }

  /* ---- daty ---- */
  function pad(n){ return String(n).padStart(2,"0"); }
  function dateKeyOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  const MONTHS_SHORT=["sty","lut","mar","kwi","maj","cze","lip","sie","wrz","paź","lis","gru"];
  function fmtDateTime(iso){
    const d=new Date(iso);
    return d.getDate()+" "+MONTHS_SHORT[d.getMonth()]+" "+d.getFullYear()+", "+pad(d.getHours())+":"+pad(d.getMinutes());
  }

  /* ---- util ---- */
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function forDate(key){ return notes.filter(n=>n.linkedDate===key); }

  /* ---- elementy DOM (przypisane w init) ---- */
  let elBtn, elTimer, elStatus, elTranscript, elActions, elMicArea, elFallback,
      elFallbackText, elProcessing, elFilter, elList, elSettings;

  /* ========== ROZPOZNAWANIE MOWY ==========
     Każda sesja rozpoznawania może zostać zakończona przez przeglądarkę po ciszy.
     Przy długim nagraniu wznawiamy sesję; aby UNIKNĄĆ DUBLOWANIA słów,
     w obrębie sesji ZAWSZE odbudowujemy pełny tekst z wszystkich wyników
     (a nie doklejamy fragmentów), a po zakończeniu sesji jej finalny tekst
     dołączamy JEDEN raz do bufora `committed`. */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const speechSupported = !!SR;
  let rec = null;
  let recording=false, processing=false, finalizing=false;
  let committed="", sessionFinal="", lastInterim="", recStart=0, timerInt=null;

  function setStatus(txt, cls){
    if(!elStatus) return;
    elStatus.textContent=txt;
    elStatus.className="rec-status"+(cls?" "+cls:"");
  }
  function showTranscript(txt){
    if(!elTranscript) return;
    if(txt){ elTranscript.textContent=txt; elTranscript.classList.remove("placeholder"); }
    else { elTranscript.textContent="Tutaj pojawi się transkrypcja…"; elTranscript.classList.add("placeholder"); }
  }
  function updateTimer(){
    if(!elTimer) return;
    const s=Math.floor((Date.now()-recStart)/1000);
    elTimer.textContent=Math.floor(s/60)+":"+pad(s%60);
  }
  function liveText(){ return (committed+" "+sessionFinal+" "+lastInterim).replace(/\s+/g," ").trim(); }

  function startRec(){
    if(recording || processing || !speechSupported) return;
    recording=true; finalizing=false;
    committed=""; sessionFinal=""; lastInterim=""; recStart=Date.now();
    elBtn.classList.add("recording");
    elTimer.classList.add("show"); updateTimer();
    timerInt=setInterval(()=>{ updateTimer(); if(Date.now()-recStart>=MAX_REC_MS) stopRec(); },500);
    setStatus("🎤 Słucham… mów teraz", "live");
    showTranscript("");
    beginSession();
  }

  function beginSession(){
    rec = new SR();
    rec.lang="pl-PL";
    rec.continuous=true;
    rec.interimResults=true;
    rec.maxAlternatives=1;
    sessionFinal=""; lastInterim="";
    rec.onresult = e=>{
      // odbuduj CAŁY tekst tej sesji od zera — zero dublowania
      let fin="", inter="";
      for(let i=0;i<e.results.length;i++){
        const t=e.results[i][0].transcript;
        if(e.results[i].isFinal) fin+=t; else inter+=t;
      }
      sessionFinal=fin; lastInterim=inter;
      showTranscript(liveText());
    };
    rec.onerror = ev=>{
      if(ev.error==="not-allowed" || ev.error==="service-not-allowed"){
        recording=false; cleanupRecUI();
        setStatus("⚠ Brak dostępu do mikrofonu. Zezwól w ustawieniach przeglądarki.","warn");
      }
      // pozostałe błędy (np. no-speech) — onend wznowi nasłuch
    };
    rec.onend = ()=>{
      // domknij tekst tej sesji do bufora (jeden raz)
      committed = (committed+" "+sessionFinal).replace(/\s+/g," ").trim();
      sessionFinal=""; lastInterim="";
      if(recording && Date.now()-recStart < MAX_REC_MS){
        try{ beginSession(); return; }catch(e){}
      }
      recording=false; cleanupRecUI();
      finalizeRec();
    };
    try{ rec.start(); }catch(e){ /* już wystartowane — ignoruj */ }
  }

  function cleanupRecUI(){
    elBtn.classList.remove("recording");
    elTimer.classList.remove("show");
    if(timerInt){ clearInterval(timerInt); timerInt=null; }
  }

  function stopRec(){
    if(!recording) return;
    recording=false;            // sygnał dla onend, by zakończyć i przetworzyć
    cleanupRecUI();
    try{ if(rec) rec.stop(); }catch(e){ finalizeRec(); }
  }

  function finalizeRec(){
    if(finalizing) return; finalizing=true;
    const transcript=(committed+" "+lastInterim).replace(/\s+/g," ").trim();
    committed=""; sessionFinal=""; lastInterim="";
    if(!transcript){
      setStatus("Nie wykryto mowy. Spróbuj ponownie.","warn");
      finalizing=false; return;
    }
    processNote(transcript).finally(()=>{ finalizing=false; });
  }

  /* ========== ANALIZA CLAUDE ========== */
  function buildPrompt(transcript){
    return "Jesteś asystentem porządkującym osobiste notatki głosowe. "+
      "Otrzymasz transkrypcję notatki nagranej po polsku.\n\n"+
      "Zwróć WYŁĄCZNIE poprawny obiekt JSON (bez markdown, bez komentarzy, bez dodatkowego tekstu) w formacie:\n"+
      '{"title":"...","summary":"...","category":"...","tags":["...","..."]}\n\n'+
      "Zasady:\n"+
      "- \"title\": krótki tytuł notatki, maksymalnie 8 słów, po polsku.\n"+
      "- \"summary\": podsumowanie w 2-3 zdaniach, po polsku.\n"+
      "- \"category\": DOKŁADNIE jedna wartość z tej listy (skopiuj wraz z emoji): "+
        CATEGORIES.join(", ")+".\n"+
      "- \"tags\": tablica 3-5 tagów, małe litery, po polsku, bez znaku #.\n\n"+
      "Transkrypcja notatki:\n\"\"\"\n"+transcript+"\n\"\"\"";
  }

  function parseClaudeJson(text){
    let t=String(text||"").trim();
    t=t.replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"");      // usuń ewentualne ogrodzenie
    const a=t.indexOf("{"), b=t.lastIndexOf("}");
    if(a!==-1 && b!==-1 && b>a) t=t.slice(a,b+1);
    const obj=JSON.parse(t);
    return normalizeMeta(obj);
  }

  function normalizeMeta(o){
    o=o||{};
    let category = CATEGORIES.includes(o.category) ? o.category : null;
    if(!category){
      // dopasuj po nazwie bez emoji
      const lc=String(o.category||"").toLowerCase();
      category = CATEGORIES.find(c=>lc && c.toLowerCase().includes(lc.replace(/[^\p{L}\s]/gu,"").trim())) || "📝 Inne";
    }
    let tags = Array.isArray(o.tags) ? o.tags.map(t=>String(t).toLowerCase().replace(/^#/,"").trim()).filter(Boolean).slice(0,5) : [];
    return {
      title: String(o.title||"").trim().split(/\s+/).slice(0,8).join(" ") || "Notatka głosowa",
      summary: String(o.summary||"").trim() || "(brak podsumowania)",
      category,
      tags
    };
  }

  function buildFallbackMeta(transcript){
    const words=transcript.split(/\s+/);
    const title=(words.slice(0,6).join(" ")||"Notatka głosowa");
    const firstSentence=(transcript.split(/(?<=[.!?])\s/)[0]||transcript).slice(0,180);
    return {
      title: title.charAt(0).toUpperCase()+title.slice(1),
      summary: firstSentence + (transcript.length>180?"…":""),
      category:"📝 Inne",
      tags:[]
    };
  }

  async function callClaude(transcript){
    const apiKey=getApiKey();
    if(!apiKey){ const e=new Error("NO_KEY"); e.code="NO_KEY"; throw e; }
    const resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{
        "content-type":"application/json",
        "x-api-key":apiKey,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify({
        model:MODEL,
        max_tokens:1024,
        messages:[{ role:"user", content:buildPrompt(transcript) }]
      })
    });
    if(!resp.ok){
      let detail=""; try{ detail=(await resp.json()).error?.message||""; }catch(e){}
      throw new Error("HTTP "+resp.status+(detail?": "+detail:""));
    }
    const data=await resp.json();
    const text=(data.content||[]).map(b=>b.text||"").join("");
    return parseClaudeJson(text);
  }

    processing=true;

    elBtn.classList.add("disabled");
    showSkeleton(true);

    let meta, warn=null;
    try{
      meta=await callClaude(transcript);
    }catch(err){
      meta=buildFallbackMeta(transcript);
      warn = err.code==="NO_KEY"
        ? "Brak klucza API — zapisano bez analizy AI. Kliknij ⚙ aby dodać klucz Claude."
        : "Claude nie odpowiedział — zapisano surową notatkę. ("+String(err.message).slice(0,90)+")";
    }

    const now=new Date();
    const note={
      id: Date.now()+"-"+Math.random().toString(36).slice(2,7),
      date: now.toISOString(),
      audioTranscript: transcript,
      title: meta.title,
      summary: meta.summary,
      category: meta.category,
      tags: meta.tags,
      linkedDate: dateKeyOf(now)
    };
    notes.unshift(note);
    persist();

    showSkeleton(false);
    processing=false;
    elBtn.classList.remove("disabled");
    showTranscript("");
    setStatus(warn ? "⚠ "+warn : "✅ Notatka zapisana: „"+note.title+"”", warn?"warn":null);

    if(window.refreshCalendar) window.refreshCalendar();

          notes=notes.filter(n=>n.id!==id); persist();
          renderFilter(); renderList();
          if(window.refreshCalendar) window.refreshCalendar();
        }
      });
    });
  }

  function copyText(text, btn){
    const done=()=>{ if(btn){ const o=btn.textContent; btn.textContent="✓ Skopiowano"; setTimeout(()=>btn.textContent=o,1500); } };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
    } else fallbackCopy(text,done);
  }
  function fallbackCopy(text,done){
    const ta=document.createElement("textarea"); ta.value=text;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand("copy"); done&&done(); }catch(e){}
    document.body.removeChild(ta);
  }

      elFallbackText.value="";
      processNote(txt);
    });
  }

  /* ========== INIT ========== */
  let inited=false;
  function init(){
    if(inited) return; inited=true;
    elBtn=document.getElementById("recBtn");
    elTimer=document.getElementById("recTimer");
    elStatus=document.getElementById("recStatus");
    elTranscript=document.getElementById("recTranscript");
    elActions=document.getElementById("recActions");
    elMicArea=document.getElementById("recMicArea");
    elFallback=document.getElementById("notesFallback");
    elFallbackText=document.getElementById("fallbackText");
    elProcessing=document.getElementById("notesProcessing");
    elFilter=document.getElementById("catFilter");
    elList=document.getElementById("notesList");
    elSettings=document.getElementById("notesSettingsBtn");

    elSettings.addEventListener("click",promptApiKey);
    refreshSettingsBadge();

    if(speechSupported){
      elBtn.addEventListener("click",()=>{ recording ? stopRec() : startRec(); });
    } else {
      setupFallback();
    }

    renderFilter(); renderList();
  }

  return {
    init,
    forDate,
    list:()=>notes,
    categoriesOf:()=>CATEGORIES,
    refreshList:()=>{ renderFilter(); renderList(); },
    escForCalendar:esc,
    fmtDateTime
  };
})();

  /* ---------- helper: podpina mic-btn do pola ---------- */
  function setupMicBtn({ btnId, prevId, inputId, continuous=false, onFinal }){
    const btn=document.getElementById(btnId);
    const prev=prevId?document.getElementById(prevId):null;
    const inp=inputId?document.getElementById(inputId):null;
    if(!btn) return;
    if(!voice.supported){ btn.classList.add('unsupported'); btn.title='Brak wsparcia mikrofonu w tej przeglądarce'; return; }

    let active=false;
    btn.addEventListener('click',()=>{
      if(active){ voice.stop(); return; }
      active=true; btn.classList.add('recording');
      if(prev){ prev.textContent='🎤 Słucham…'; prev.classList.add('active'); }
      voice.listen({
        continuous,
        onInterim: t=>{ if(prev){ prev.textContent=t; prev.classList.add('active'); } },
        onFinal: t=>{
          if(inp) inp.value += (inp.value&&!inp.value.endsWith(' ')?' ':'')+t;
          if(prev){ prev.textContent='✓ '+t; prev.classList.remove('active'); }
          onFinal?.(t);
        },
        onEnd:()=>{ active=false; btn.classList.remove('recording');
          setTimeout(()=>{ if(prev) prev.textContent=''; },2000); },
        onError: msg=>{ active=false; btn.classList.remove('recording');
          if(prev){ prev.textContent='⚠ '+msg; prev.classList.remove('active'); } }
      });
    });
  }

  function setupActivityForm(area){
    const form=document.getElementById("actForm");
    const startI=document.getElementById("actStart"), endI=document.getElementById("actEnd");
    const durBadge=document.getElementById("durBadge");

    const updDur=()=>durBadge.textContent=fmtDuration(minutesOf(startI.value),minutesOf(endI.value));
    startI.addEventListener("input",updDur); endI.addEventListener("input",updDur);

    // mikrofon — dyktuj całą aktywność (smart parser)
    const resultBox   = document.getElementById('voiceResultBox');
    const parsedBox   = document.getElementById('voiceParsed');
    const vpName      = document.getElementById('vpName');
    const vpTime      = document.getElementById('vpTime');
    const micDictate  = document.getElementById('micDictateBtn');
    const applyBtn    = document.getElementById('voiceApplyBtn');
    let lastParsed    = null;

    if(voice.supported){
      let activeD=false;
      micDictate.addEventListener('click',()=>{
        if(activeD){ voice.stop(); return; }
        activeD=true; micDictate.classList.add('recording');
        resultBox.textContent='🎤 Słucham…'; resultBox.classList.remove('filled');
        parsedBox.classList.remove('show');
        voice.listen({
          continuous:false,
          onInterim: t=>{ resultBox.textContent=t; },
          onFinal: t=>{
            // auto-apply — od razu wypełnia pola bez klikania przycisku
            lastParsed=parseActivityVoice(t);
            document.getElementById('actName').value = lastParsed.name;
            startI.value=lastParsed.start; endI.value=lastParsed.end; updDur();
            // potwierdzenie wizualne
            resultBox.textContent='✓ '+lastParsed.name+' · '+lastParsed.start+'–'+lastParsed.end;
            resultBox.classList.add('filled');
            vpName.textContent=lastParsed.name;
            vpTime.textContent=lastParsed.start+' – '+lastParsed.end;
            parsedBox.classList.add('show');
            setTimeout(()=>parsedBox.classList.remove('show'), 3000);
          },
          onEnd:()=>{ activeD=false; micDictate.classList.remove('recording'); },
          onError: msg=>{ activeD=false; micDictate.classList.remove('recording'); resultBox.textContent='⚠ '+msg; }
        });
      });
      // przycisk "Wstaw" nadal działa jako ręczne potwierdzenie
      applyBtn.addEventListener('click',()=>{
        if(!lastParsed) return;
        document.getElementById('actName').value = lastParsed.name;
        startI.value=lastParsed.start; endI.value=lastParsed.end; updDur();
        parsedBox.classList.remove('show');
      });
    } else {
      micDictate.classList.add('unsupported');
      micDictate.title='Brak wsparcia mikrofonu';
    }

    updDur(); // inicjalizacja
    document.getElementById("addActBtn").addEventListener("click",()=>form.classList.toggle("hidden"));
    document.getElementById("cancelActBtn").addEventListener("click",()=>form.classList.add("hidden"));
    document.getElementById("saveActBtn").addEventListener("click",()=>{
      if(minutesOf(endI.value)<=minutesOf(startI.value)){ alert("Godzina zakończenia musi być późniejsza niż rozpoczęcia"); return; }
      const notify=document.getElementById("actNotify").value;
      const day=getDay(selectedKey);
      day.activities.push({
        id:Date.now()+"-"+Math.random().toString(36).slice(2,7),
        name: document.getElementById("actName").value.trim() || "Aktywność "+startI.value,
        start:startI.value, end:endI.value, color:ACT_COLOR, notify:notify
      });
      day.activities.sort((a,b)=>minutesOf(a.start)-minutesOf(b.start));
      saveData();
      if(notify) requestNotifyPermission();
      scheduleNotifications();
      renderDay(area);
    });
  }

  function renderTimeline(){
    const wrap=document.getElementById("timelineWrap");
    const day=getDay(selectedKey);
    let html='<div class="timeline">';
    for(let h=DAY_START;h<=DAY_END;h++)
      html+='<div class="hour-row"><span class="hour-label">'+pad(h)+':00</span><div class="hour-line"></div></div>';
    html+='<div class="activities-layer" id="actLayer"></div></div>';
    wrap.innerHTML=html;

    const layer=document.getElementById("actLayer");
    const rangeStart=DAY_START*60;

    if(!day.activities.length){
      const hint=document.createElement("div");
      hint.className="empty-hint"; hint.style.pointerEvents="auto";
      hint.textContent="Brak aktywności. Kliknij „Dodaj aktywność”.";
      wrap.querySelector(".timeline").appendChild(hint);
    }

    day.activities.forEach(act=>{
      let s=minutesOf(act.start), e=minutesOf(act.end); if(e<=s) e=s+30;
      const cs=Math.max(s,rangeStart), ce=Math.min(e,DAY_END*60+60);
      const top=(cs-rangeStart)/60*HOUR_PX;
      const height=Math.max((ce-cs)/60*HOUR_PX,22);
      const b=document.createElement("div");
      b.className="activity-block"; b.style.top=top+"px"; b.style.height=height+"px"; b.style.background=act.color;
      const bell = notifyShort(act.notify) ? ' · 🔔 '+notifyShort(act.notify) : '';
      b.innerHTML='<span class="act-name">'+escapeHtml(act.name)+'</span>'+
        '<span class="act-meta">'+act.start+'–'+act.end+' · '+act.cat+' · '+fmtDuration(s,e)+bell+'</span>'+
        '<span class="act-del" title="Usuń">×</span>';
      b.querySelector(".act-del").addEventListener("click",ev=>{
        ev.stopPropagation();
        if(confirm("Usunąć aktywność „"+act.name+"”?")){
          if(scheduled[act.id]){ clearTimeout(scheduled[act.id]); delete scheduled[act.id]; }
          const d=getDay(selectedKey);
          d.activities=d.activities.filter(a=>a.id!==act.id);
          saveData(); renderDay(document.getElementById("viewArea"));
        }
      });
      layer.appendChild(b);
    });
  }

  /* ====== UTIL ====== */
  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  /* ====== POWIADOMIENIA ====== */
  const scheduled = {};   // id aktywności -> timeoutId (by nie dublować)
  function requestNotifyPermission(){
    if("Notification" in window && Notification.permission==="default"){
      Notification.requestPermission();
    }
  }
  function fireNotify(act){
    const title="🔔 "+act.name;
    const body=act.start+"–"+act.end+" · "+act.cat;
    if("Notification" in window && Notification.permission==="granted"){
      try{ new Notification(title,{body}); return; }catch(e){}
    }
    // zapasowo: gdy brak zgody / wsparcia
    console.log("Przypomnienie:",title,body);
  }
  function scheduleNotifications(){
    const now=Date.now();
    const maxAhead=26*3600*1000; // planuj tylko zdarzenia w najbliższych ~26h
    for(const key in data){
      const acts=(data[key]&&data[key].activities)||[];
      acts.forEach(act=>{
        if(!act.notify) return;
        const dt=parseKey(key);
        const [h,m]=act.start.split(":").map(Number);
        dt.setHours(h,m,0,0);
        const trigger=dt.getTime()-Number(act.notify)*60000;
        const delay=trigger-now;
        if(delay>0 && delay<=maxAhead && !scheduled[act.id]){
          scheduled[act.id]=setTimeout(()=>{ fireNotify(act); delete scheduled[act.id]; }, delay);
        }
      });
    }
  }

  /* ====== MODAL WYDARZEŃ DNIA ====== */
  (function initModal(){
    const overlay  = document.getElementById('actModal');
    const closeBtn = document.getElementById('modalClose');
    const goDayBtn = document.getElementById('modalGoDay');
    const dateEl   = document.getElementById('modalDate');
    const listEl   = document.getElementById('modalEventList');
    const notesSec = document.getElementById('modalNotesSection');
    const notesEl  = document.getElementById('modalNotesList');
    let _key = null;

    function buildNotes(){
      const ns = VN.forDate(_key);
      if(!ns.length){ notesSec.style.display='none'; notesEl.innerHTML=''; return; }
      notesSec.style.display='block';
      notesEl.innerHTML = ns.map(n=>`
        <div class="modal-note-item">
          <div class="mni-title">${VN.escForCalendar(n.title)}</div>
          <div class="mni-meta">${VN.escForCalendar(n.category)} · ${VN.escForCalendar(VN.fmtDateTime(n.date))}</div>
          <div class="mni-sum">${VN.escForCalendar(n.summary)}</div>
        </div>`).join('');
    }

    function buildList(){
      buildNotes();
      const acts = sortedActs(_key);
      if(!acts.length){
        listEl.innerHTML='<div class="modal-empty">Brak wydarzeń w tym dniu</div>';
        return;
      }
      listEl.innerHTML = acts.map(act=>{
        const s=minutesOf(act.start), e=minutesOf(act.end);
        const notifyOpt = NOTIFY_OPTS.find(o=>o.v===String(act.notify||''));
        const notifyTxt = notifyOpt&&notifyOpt.short ? ' · 🔔 '+notifyOpt.label : '';
        return `<div class="modal-ev-card">
          <div class="modal-ev-strip" style="background:${act.color||ACT_COLOR}"></div>
          <div class="modal-ev-body">
            <div class="modal-ev-name">${escapeHtml(act.name)}</div>
            <div class="modal-ev-meta">
              <span>🕐 ${act.start} – ${act.end}</span>
              <span>${fmtDuration(s,e)}</span>
              ${notifyTxt?'<span>'+notifyTxt+'</span>':''}
            </div>
          </div>
          <button class="modal-ev-del" data-delid="${act.id}" title="Usuń">×</button>
        </div>`;
      }).join('');

      listEl.querySelectorAll('.modal-ev-del').forEach(btn=>{
        btn.addEventListener('click',()=>{
          if(confirm('Usunąć wydarzenie?')){
            const d=getDay(_key);
            d.activities=d.activities.filter(a=>a.id!==btn.dataset.delid);
            saveData(); render(); buildList();
          }
        });
      });
    }

    window.openDayModal = function(key){
      const acts = sortedActs(key);
      const hasNotes = VN.forDate(key).length>0;
      if(!acts.length && !hasNotes){ openDay(key); return; } // pusto → otwórz planer
      _key = key;
      dateEl.textContent = longDate(key);
      buildList();
      overlay.classList.remove('hidden');
    };

    function closeModal(){ overlay.classList.add('hidden'); _key=null; }
    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

    goDayBtn.addEventListener('click',()=>{ const k=_key; closeModal(); openDay(k); });
  })();

  /* ====== AKCJE ====== */
  function openDay(key){
    selectedKey=key;
    viewDate=parseKey(key);
    viewMode="day";
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  document.getElementById("viewSwitch").addEventListener("click",e=>{
    const b=e.target.closest("button[data-mode]"); if(!b) return;
    viewMode=b.dataset.mode;
    if(viewMode==="day") viewDate=parseKey(selectedKey);
    render();
  });

  document.getElementById("prevBtn").addEventListener("click",()=>{
    if(viewMode==="month") viewDate.setMonth(viewDate.getMonth()-1);
    else if(viewMode==="week") viewDate.setDate(viewDate.getDate()-7);
    else{ viewDate.setDate(viewDate.getDate()-1); selectedKey=keyOfDate(viewDate); }
    render();
  });
  document.getElementById("nextBtn").addEventListener("click",()=>{
    if(viewMode==="month") viewDate.setMonth(viewDate.getMonth()+1);
    else if(viewMode==="week") viewDate.setDate(viewDate.getDate()+7);
    else{ viewDate.setDate(viewDate.getDate()+1); selectedKey=keyOfDate(viewDate); }
    render();
  });
  document.getElementById("todayBtn").addEventListener("click",()=>{
    viewDate=new Date(); selectedKey=todayKey(); render();
  });

  /* ====== START ====== */

  // udostępnij odświeżanie kalendarza modułowi notatek (ikona 🎙️)
  window.refreshCalendar = render;

  // Obsługa skrótu ?view=today z manifest.json shortcuts
  if(new URLSearchParams(location.search).get('view')==='today'){
    viewDate=new Date(); selectedKey=todayKey(); viewMode='day';
  }

  /* ====== GŁÓWNE ZAKŁADKI: KALENDARZ / NOTATKI ====== */
  (function initMainTabs(){
    const tabs=document.getElementById("mainTabs");
    const calEl=document.getElementById("calendarTab");
    const notesEl=document.getElementById("notesTab");
    const titleEl=document.getElementById("appTitle");
    VN.init();
    tabs.addEventListener("click",e=>{
      const b=e.target.closest("button[data-tab]"); if(!b) return;
      const tab=b.dataset.tab;
      [...tabs.children].forEach(x=>x.classList.toggle("active",x===b));
      const isNotes = tab==="notes";
      calEl.style.display   = isNotes ? "none" : "";
      notesEl.style.display = isNotes ? "" : "none";
      titleEl.textContent   = isNotes ? "Notatki" : "Kalendarz";
      if(isNotes) VN.refreshList();
      else render();
      window.scrollTo({top:0,behavior:"smooth"});
    });
  })();

  render();
  scheduleNotifications();
})();

/* ====================================================
   PWA — Service Worker + Install Prompt
   (poza IIFE, by dostęp do globalnego scope)
   ==================================================== */
(function initPWA(){

  /* 1. Rejestracja Service Workera */
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' })
        .then(reg => {
          console.log('[SW] Zarejestrowany, scope:', reg.scope);
          // Sprawdź aktualizację przy każdym otwarciu
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
                console.log('[SW] Nowa wersja dostępna — odśwież stronę.');
              }
            });
          });
        })
        .catch(err => console.warn('[SW] Błąd rejestracji:', err));
    });
  }

  /* 2. Pasek instalacji PWA */
  const bar      = document.getElementById('pwaBar');
  const btnYes   = document.getElementById('pwaBarInstall');
  const btnNo    = document.getElementById('pwaBarDismiss');
  let deferredPrompt = null;


  // Chrome / Edge / Android — beforeinstallprompt
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    // Nie pokazuj jeśli już w trybie standalone
    if(!window.matchMedia('(display-mode: standalone)').matches){
      bar.classList.remove('hidden');
    }
  });

  btnYes.addEventListener('click', async () => {
    if(!deferredPrompt) return;
    bar.classList.add('hidden');
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('[PWA] Wybór użytkownika:', outcome);
    deferredPrompt = null;
  });

  btnNo.addEventListener('click', () => {
    bar.classList.add('hidden');
    // Ukryj na 7 dni
    localStorage.setItem('pwa-dismissed', Date.now() + 7*24*3600*1000);
  });

  // Nie pokazuj jeśli użytkownik kliknął "Nie teraz" niedawno
  const dismissedUntil = Number(localStorage.getItem('pwa-dismissed') || 0);
  if(Date.now() < dismissedUntil){
    window.addEventListener('beforeinstallprompt', e => e.preventDefault(), { once: true });
  }

  // Po instalacji schowaj pasek
  window.addEventListener('appinstalled', () => {
    bar.classList.add('hidden');
    deferredPrompt = null;
    console.log('[PWA] Zainstalowano!');
  });

  /* 3. iOS Safari — ręczna instrukcja (iOS nie obsługuje beforeinstallprompt) */
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.navigator.standalone === true;
  const iosDismissed = Number(localStorage.getItem('pwa-ios-dismissed') || 0);

  if(isIOS && !isStandalone && Date.now() > iosDismissed){
    // Pokaż własny pasek z instrukcją dla iOS
    const iosBar = document.createElement('div');
    iosBar.className = 'pwa-install-bar';
    iosBar.style.background = '#1d4ed8';
    iosBar.innerHTML = `
      <div class="pwa-install-bar-text" style="flex:1">
        <span>📲 Aby zainstalować: dotknij <strong>Udostępnij</strong> →
              <strong>Dodaj do ekranu głównego</strong></span>
      </div>
      <div class="pwa-install-bar-actions">
        <button class="dismiss" id="iosDismiss">OK</button>
      </div>`;
    document.body.appendChild(iosBar);
    document.getElementById('iosDismiss').addEventListener('click', () => {
      iosBar.classList.add('hidden');
      localStorage.setItem('pwa-ios-dismissed', Date.now() + 14*24*3600*1000);
    });
  }

})();
</script>
