<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kalendarz-Dziennik</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f1745a">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dziennik">
<link rel="apple-touch-icon" href="./icons/icon.svg">

<!-- Czcionki -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* akcenty */
    --accent:#f1745a;          /* łosoś — akcent główny (oszczędnie) */
    --accent-soft:#ffe2d8;
    --accent-hover:#e25c41;
    --teal:#159b8a;            /* morski — drugi pasujący kolor */
    --teal-soft:#d3efeb;
    --teal-hover:#0e8273;
    /* tła — mało łososiu, dużo jasnego */
    --bg:#fbf5f1;              /* jasny kremowy z nutą łososiu */
    --card:#ffffff;            /* białe karty */
    --inset:#f8efe9;           /* pola wewnątrz kart */
    --text:#0a0a0a;            /* czarna czcionka */
    --muted:#262626;           /* dawniej szary — teraz prawie czarny */
    --border:#ecd5c9;
    --border-strong:#d9b6a4;
    --shadow:0 2px 6px rgba(120,60,40,.08),0 10px 28px rgba(120,60,40,.08);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Nunito","Segoe UI Rounded","SF Pro Rounded",ui-rounded,"Comic Sans MS",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    font-weight:600;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:1.6rem;font-weight:800;text-align:center;margin-bottom:4px}
  .subtitle{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:20px}

  /* ===== PRZEŁĄCZNIK WIDOKU ===== */
  .view-switch{
    display:flex;gap:6px;justify-content:center;margin-bottom:16px;
    background:var(--card);border:2px solid var(--border);border-radius:14px;
    padding:5px;width:fit-content;margin-left:auto;margin-right:auto;box-shadow:var(--shadow);
  }
  .view-switch button{
    border:none;background:transparent;color:var(--text);
    padding:8px 20px;border-radius:10px;cursor:pointer;
    font-size:.9rem;font-weight:700;font-family:inherit;transition:all .15s;
  }
  .view-switch button:hover{background:var(--inset)}
  .view-switch button.active{background:var(--teal);color:#fff}

  /* ===== NAGŁÓWEK NAWIGACJI ===== */
  .cal-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;gap:12px;
  }
  .cal-title{font-size:1.2rem;font-weight:800;text-transform:capitalize;text-align:center;line-height:1.2}
  .cal-title small{display:block;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:none}
  .nav-btn{
    border:2px solid var(--border-strong);
    background:var(--card);
    width:42px;height:42px;border-radius:12px;
    font-size:1.2rem;cursor:pointer;color:var(--text);
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;flex:0 0 auto;
  }
  .nav-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .today-btn{
    border:2px solid var(--border-strong);background:var(--card);
    padding:0 14px;height:42px;border-radius:12px;cursor:pointer;
    font-size:.85rem;font-weight:700;color:var(--text);transition:all .15s;font-family:inherit;
  }
  .today-btn:hover{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-hover)}

  /* ===== KARTA WIDOKU ===== */
  .card{
    background:var(--card);
    border:2px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
  }

  /* ===== MIESIĄC ===== */
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
  .weekday{
    text-align:center;font-size:.72rem;font-weight:800;
    color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:4px 0;
  }
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day{
    position:relative;min-height:92px;border-radius:12px;
    border:2px solid var(--border);background:var(--inset);
    padding:5px 5px 4px;cursor:pointer;transition:all .12s;user-select:none;
    display:flex;flex-direction:column;gap:3px;overflow:hidden;
  }
  .day:hover{border-color:var(--accent);background:#fff}
  .day.empty{background:transparent;border-color:transparent;cursor:default}
  .day-num{font-size:.9rem;font-weight:800;display:flex;align-items:center;gap:4px}
  .day.today .day-num{
    color:#fff;background:var(--teal);border-radius:8px;
    width:24px;height:24px;justify-content:center;
  }
  .day.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
  .day-events{display:flex;flex-direction:column;gap:2px;overflow:hidden}

  /* skróty wydarzeń (paski) */
  .ev-chip{
    font-size:.66rem;font-weight:700;line-height:1.25;
    padding:2px 6px;border-radius:5px;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ev-more{font-size:.62rem;font-weight:700;color:var(--muted);padding-left:3px}

  /* ===== TYDZIEŃ ===== */
  .week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .week-day{
    border:2px solid var(--border);border-radius:14px;background:var(--inset);
    padding:12px;cursor:pointer;transition:all .12s;min-height:120px;
    display:flex;flex-direction:column;gap:8px;
  }
  .week-day:hover{border-color:var(--accent);background:#fff}
  .week-day.today{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-soft)}
  .week-day-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .week-day-name{font-size:.78rem;font-weight:800;text-transform:uppercase;color:var(--muted)}
  .week-day-num{font-size:1.3rem;font-weight:800}
  .week-day.today .week-day-num{color:var(--teal)}
  .week-events{display:flex;flex-direction:column;gap:4px}
  .week-events .ev-chip{font-size:.74rem;padding:4px 8px;border-radius:7px}
  .week-empty{font-size:.78rem;color:var(--muted);opacity:.7}

  /* ===== WIDOK DNIA ===== */
  .day-view{display:block}
  .panel{
    background:var(--card);border:2px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;
  }
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;gap:10px;flex-wrap:wrap;
  }
  .panel-head h2{font-size:1.05rem;font-weight:800}
  .panel-date{font-size:.82rem;color:var(--muted);text-transform:capitalize}
  .btn{
    border:none;background:var(--accent);color:#fff;
    padding:9px 16px;border-radius:10px;cursor:pointer;
    font-size:.85rem;font-weight:700;font-family:inherit;transition:background .15s;
  }
  .btn:hover{background:var(--accent-hover)}
  .btn.teal{background:var(--teal)}
  .btn.teal:hover{background:var(--teal-hover)}
  .btn.ghost{background:var(--card);color:var(--accent);border:2px solid var(--accent)}
  .btn.ghost:hover{background:var(--accent-soft)}
  .btn.small{padding:6px 12px;font-size:.8rem}

  /* ===== TIMELINE ===== */
  .timeline{
    position:relative;flex:1;min-height:420px;
    border-left:2px solid var(--border);margin-left:46px;margin-top:6px;
  }
  .hour-row{position:relative;height:42px;}
  .hour-label{position:absolute;left:-46px;top:-8px;width:40px;text-align:right;font-size:.7rem;font-weight:700;color:var(--muted)}
  .hour-line{position:absolute;left:0;right:0;top:0;border-top:1px dashed var(--border)}
  .activities-layer{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
  .activity-block{
    position:absolute;left:6px;right:6px;border-radius:8px;
    padding:5px 9px;color:#fff;font-size:.78rem;overflow:hidden;
    pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.18);
    display:flex;flex-direction:column;justify-content:flex-start;
  }
  .activity-block .act-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .activity-block .act-meta{font-size:.68rem;font-weight:600;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .activity-block .act-del{
    position:absolute;top:3px;right:4px;cursor:pointer;
    background:rgba(0,0,0,.2);border-radius:50%;width:17px;height:17px;
    display:flex;align-items:center;justify-content:center;font-size:.8rem;line-height:1;
  }
  .activity-block .act-del:hover{background:rgba(0,0,0,.45)}
  .empty-hint{color:var(--muted);font-size:.85rem;text-align:center;padding:24px 10px}

  /* ===== FORMULARZ ===== */
  .form{background:var(--inset);border:2px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  .form.hidden{display:none}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:.78rem;font-weight:800;color:var(--muted);margin-bottom:5px}
  .field input,.field select{
    width:100%;padding:9px 10px;border:2px solid var(--border-strong);
    border-radius:9px;font-size:.9rem;font-weight:600;font-family:inherit;background:var(--card);color:var(--text);
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .duration-badge{display:inline-block;background:var(--teal-soft);color:var(--teal-hover);padding:5px 10px;border-radius:8px;font-size:.8rem;font-weight:800}
  .colors{display:flex;gap:10px}
  .color-opt{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .1s}
  .color-opt:hover{transform:scale(1.12)}
  .color-opt.active{border-color:var(--text);transform:scale(1.12)}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}


  /* ===== MIKROFON ===== */
  .mic-btn{
    flex:0 0 auto;width:38px;height:38px;border-radius:50%;
    border:2px solid var(--border-strong);background:var(--card);
    color:var(--muted);cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:all .15s;padding:0;
  }
  .mic-btn:hover{border-color:var(--accent);color:var(--accent)}
  .mic-btn.recording{
    background:#ef4444;border-color:#ef4444;color:#fff;
    animation:mic-pulse 1s ease-in-out infinite;
  }
  .mic-btn.unsupported{opacity:.35;cursor:not-allowed}
  @keyframes mic-pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}
    50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}
  }
  .field-row{display:flex;gap:8px;align-items:center}
  .field-row input,.field-row select{flex:1;min-width:0}
  .mic-preview{
    font-size:.78rem;color:var(--muted);font-style:italic;
    min-height:18px;margin-top:4px;padding:0 2px;
    transition:color .2s;
  }
  .mic-preview.active{color:var(--accent)}
  .voice-dictate-wrap{
    background:var(--teal-soft);border:2px solid var(--teal);
    border-radius:12px;padding:12px 14px;margin-bottom:12px;
    display:flex;flex-direction:column;gap:8px;
  }
  .voice-dictate-wrap label{
    font-size:.78rem;font-weight:800;color:var(--teal-hover);
  }
  .voice-dictate-row{display:flex;gap:8px;align-items:center}
  .voice-result-box{
    background:var(--card);border:2px solid var(--border);border-radius:9px;
    padding:9px 12px;font-size:.82rem;color:var(--text);min-height:36px;
    flex:1;font-style:italic;color:var(--muted);
  }
  .voice-result-box.filled{font-style:normal;color:var(--text)}
  .voice-parsed{
    display:none;flex-direction:column;gap:4px;
    background:var(--card);border:2px solid var(--teal);
    border-radius:9px;padding:10px 12px;font-size:.8rem;
  }
  .voice-parsed.show{display:flex}
  .voice-parsed-row{display:flex;gap:6px;align-items:center}
  .voice-parsed-label{font-weight:800;color:var(--muted);min-width:60px}
  .voice-parsed-val{color:var(--text);font-weight:700}
  .voice-apply-btn{
    border:none;background:var(--teal);color:#fff;
    padding:7px 14px;border-radius:9px;cursor:pointer;
    font-size:.8rem;font-weight:800;font-family:inherit;
    margin-top:4px;align-self:flex-end;
  }

  /* ===== PRZYCISK INSTALACJI PWA ===== */
  .pwa-install-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:999;
    background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 20px;
    padding-bottom:calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 24px rgba(21,155,138,.3);
    font-family:inherit;
    transform:translateY(0);transition:transform .3s ease;
  }
  .pwa-install-bar.hidden{transform:translateY(120%)}
  .pwa-install-bar-text{display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:700}
  .pwa-install-bar-text svg{flex:0 0 32px}
  .pwa-install-bar-actions{display:flex;gap:8px;flex:0 0 auto}
  .pwa-install-bar .dismiss{
    background:transparent;border:2px solid rgba(255,255,255,.5);
    color:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;
    font-size:.82rem;font-weight:700;font-family:inherit;
  }
  .pwa-install-bar .install{
    background:#fff;color:var(--teal);border:none;
    padding:8px 18px;border-radius:10px;cursor:pointer;
    font-size:.88rem;font-weight:800;font-family:inherit;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  .pwa-install-bar .install:hover{background:var(--teal-soft)}
  .pwa-running-badge{
    display:none;align-items:center;gap:6px;
    background:var(--teal-soft);color:var(--teal-hover);
    border-radius:20px;padding:4px 12px;font-size:.75rem;font-weight:800;
    border:2px solid var(--teal);margin:0 auto 16px;width:fit-content;
  }
  .pwa-running-badge.show{display:flex}

  @media (max-width:760px){
    h1{font-size:1.35rem}
    .cal-title{font-size:1.02rem}
    .day{min-height:74px}
    .days,.weekdays{gap:5px}
    .ev-chip{font-size:.6rem;padding:1px 4px}
    .app{padding-bottom:80px}   /* miejsce na pasek instalacji */
  }
</style>
</head>
<body>
<div class="app">
  <h1>📅 Kalendarz-Dziennik</h1>
  <p class="subtitle">Planuj aktywności i prowadź swój dziennik</p>
  <!-- Widoczne gdy app działa ze skrótu na pulpicie -->
  <div class="pwa-running-badge" id="pwaBadge">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
    Aplikacja zainstalowana
  </div>

  <div class="view-switch" id="viewSwitch">
    <button data-mode="month">Miesiąc</button>
    <button data-mode="week">Tydzień</button>
    <button data-mode="day">Dzień</button>
  </div>

  <div class="cal-header">
    <button class="nav-btn" id="prevBtn" aria-label="Poprzedni">‹</button>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="cal-title" id="calTitle"></span>
      <button class="today-btn" id="todayBtn">Dziś</button>
    </div>
    <button class="nav-btn" id="nextBtn" aria-label="Następny">›</button>
  </div>

  <div id="viewArea"></div>
</div>

<!-- Pasek instalacji PWA (pojawia się automatycznie) -->
<div class="pwa-install-bar hidden" id="pwaBar">
  <div class="pwa-install-bar-text">
    <svg viewBox="0 0 512 512" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
      <rect width="512" height="512" rx="80" fill="rgba(255,255,255,0.2)"/>
      <rect x="96" y="130" width="320" height="280" rx="28" fill="white" opacity="0.9"/>
      <rect x="96" y="130" width="320" height="90" rx="28" fill="rgba(255,255,255,0.4)"/>
      <rect x="156" y="88" width="22" height="70" rx="11" fill="white"/>
      <rect x="334" y="88" width="22" height="70" rx="11" fill="white"/>
    </svg>
    <span>Zainstaluj aplikację na telefonie</span>
  </div>
  <div class="pwa-install-bar-actions">
    <button class="dismiss" id="pwaBarDismiss">Nie teraz</button>
    <button class="install" id="pwaBarInstall">Zainstaluj</button>
  </div>
</div>

<script>
/* ========================================================
   VOICE INPUT — Web Speech API
   ======================================================== */
class VoiceInput {
  constructor(lang='pl-PL'){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    this.supported = !!SR;
    if(!this.supported) return;
    this.rec = new SR();
    this.rec.lang = lang;
    this.rec.maxAlternatives = 1;
  }
  listen({ continuous=false, onInterim, onFinal, onEnd, onError }={}){
    if(!this.supported){ onError?.('Twoja przeglądarka nie obsługuje rozpoznawania mowy.'); return; }
    this.rec.continuous = continuous;
    this.rec.interimResults = !!onInterim;
    this.rec.onresult = e => {
      let interim='', final='';
      for(let i=e.resultIndex; i<e.results.length; i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) final += t;
        else interim += t;
      }
      if(interim) onInterim?.(interim);
      if(final)   onFinal?.(final);
    };
    this.rec.onerror = e => onError?.(e.error==='not-allowed'
      ? 'Brak dostępu do mikrofonu. Zezwól w ustawieniach przeglądarki.'
      : 'Błąd mikrofonu: '+e.error);
    this.rec.onend = () => onEnd?.();
    this.rec.start();
  }
  stop(){ try{ this.rec?.stop(); }catch(e){} }
}

/* ========================================================
   PARSER POLSKICH KOMEND GŁOSOWYCH
   ======================================================== */
const _VI = (()=>{
  const H = {
    'zero':0,'północ':0,'pierwsza':1,'druga':2,'trzecia':3,'czwarta':4,
    'piąta':5,'szósta':6,'siódma':7,'ósma':8,'dziewiąta':9,'dziesiąta':10,
    'jedenasta':11,'dwunasta':12,'trzynasta':13,'czternasta':14,'piętnasta':15,
    'szesnasta':16,'siedemnasta':17,'osiemnasta':18,'dziewiętnasta':19,
    'dwudziesta':20,'dwudziesta pierwsza':21,'dwudziesta druga':22,'dwudziesta trzecia':23
  };
  const M = {
    'zero':0,'pięć':5,'dziesięć':10,'kwadrans':15,'piętnaście':15,
    'dwadzieścia':20,'dwadzieścia pięć':25,'pół':30,'trzydzieści':30,
    'trzydzieści pięć':35,'czterdzieści':40,'czterdzieści pięć':45,
    'pięćdziesiąt':50,'pięćdziesiąt pięć':55
  };
  const CAT_MAP = {
    'praca':['praca','pracy','pracę','służbowe'],'Sport':['sport','sportu','trening','siłownia','bieganie','rower','basen'],
    'Nauka':['nauka','nauki','uczenie','kurs','lekcja','szkoła','studia'],
    'Spotkanie':['spotkanie','spotkania','meeting','zebranie','wizyta'],'Inne':[]
  };
  const PAD = n => String(n).padStart(2,'0');

  function extractTime(text){
    // cyfry: "10:30", "10.30", "1030"
    let m = text.match(/\b(\d{1,2})[:\.](\d{2})\b/);
    if(m) return PAD(m[1])+':'+PAD(m[2]);
    m = text.match(/\b([01]?\d|2[0-3])(\d{2})\b/);
    if(m) return PAD(m[1])+':'+PAD(m[2]);
    // słowa — godziny dwuczłonowe najpierw
    const sortedH = Object.keys(H).sort((a,b)=>b.length-a.length);
    for(const hName of sortedH){
      if(text.includes(hName)){
        const after = text.slice(text.indexOf(hName)+hName.length).trim();
        const sortedM = Object.keys(M).sort((a,b)=>b.length-a.length);
        for(const mName of sortedM){
          if(after.startsWith(mName)) return PAD(H[hName])+':'+PAD(M[mName]);
        }
        return PAD(H[hName])+':00';
      }
    }
    return null;
  }

  function extractAllTimes(text){
    const times=[];
    let s=text;
    for(let i=0;i<2;i++){
      const t=extractTime(s); if(!t) break;
      times.push(t);
      // usuń dopasowany fragment żeby znaleźć drugi czas
      const sortedH=Object.keys(H).sort((a,b)=>b.length-a.length);
      for(const hName of sortedH){
        const idx=s.indexOf(hName);
        if(idx!==-1){ s=s.slice(idx+hName.length); break; }
      }
      const dm=s.match(/\b(\d{1,2})[:\.](\d{2})\b/);
      if(dm) s=s.slice(s.indexOf(dm[0])+dm[0].length);
    }
    return times;
  }

  function extractCategory(text){
    const lo=text.toLowerCase();
    for(const [cat, words] of Object.entries(CAT_MAP)){
      if(words.some(w=>lo.includes(w))) return cat;
    }
    return 'Inne';
  }

  function extractName(text, cat, times){
    let s=text.toLowerCase();
    // usuń słowa kategorii
    const catWords = Object.values(CAT_MAP).flat();
    catWords.forEach(w=>{ s=s.replace(new RegExp('\\b'+w+'\\b','gi'),''); });
    // usuń godziny (słowne i cyfrowe)
    Object.keys(H).sort((a,b)=>b.length-a.length).forEach(h=>{ s=s.replace(new RegExp('\\b'+h+'\\b','gi'),''); });
    Object.keys(M).sort((a,b)=>b.length-a.length).forEach(m=>{ s=s.replace(new RegExp('\\b'+m+'\\b','gi'),''); });
    s=s.replace(/\b(\d{1,2})[:\.](\d{2})\b/g,'');
    s=s.replace(/\b(od|do|godzina|godz|przez)\b/gi,'');
    s=s.replace(/\s+/g,' ').trim();
    // Capitalize
    return s.charAt(0).toUpperCase()+s.slice(1) || 'Aktywność';
  }

  return { extractTime, extractAllTimes, extractCategory, extractName };
})();

function parseActivityVoice(text){
  const times = _VI.extractAllTimes(text.toLowerCase());
  const cat   = _VI.extractCategory(text);
  const name  = _VI.extractName(text, cat, times);
  return { name, cat, start: times[0]||'08:00', end: times[1]||'09:00' };
}

  /* ---------- helper: podpina mic-btn do pola ---------- */
  function setupMicBtn({ btnId, prevId, inputId, continuous=false, onFinal }){
    const btn=document.getElementById(btnId);
    const prev=prevId?document.getElementById(prevId):null;
    const inp=inputId?document.getElementById(inputId):null;
    if(!btn) return;
    if(!voice.supported){ btn.classList.add('unsupported'); btn.title='Brak wsparcia mikrofonu w tej przeglądarce'; return; }

    let active=false;
    btn.addEventListener('click',()=>{
      if(active){ voice.stop(); return; }
      active=true; btn.classList.add('recording');
      if(prev){ prev.textContent='🎤 Słucham…'; prev.classList.add('active'); }
      voice.listen({
        continuous,
        onInterim: t=>{ if(prev){ prev.textContent=t; prev.classList.add('active'); } },
        onFinal: t=>{
          if(inp) inp.value += (inp.value&&!inp.value.endsWith(' ')?' ':'')+t;
          if(prev){ prev.textContent='✓ '+t; prev.classList.remove('active'); }
          onFinal?.(t);
        },
        onEnd:()=>{ active=false; btn.classList.remove('recording');
          setTimeout(()=>{ if(prev) prev.textContent=''; },2000); },
        onError: msg=>{ active=false; btn.classList.remove('recording');
          if(prev){ prev.textContent='⚠ '+msg; prev.classList.remove('active'); } }
      });
    });
  }

  function renderTimeline(){
    const wrap=document.getElementById("timelineWrap");
    const day=getDay(selectedKey);
    let html='<div class="timeline">';
    for(let h=DAY_START;h<=DAY_END;h++)
      html+='<div class="hour-row"><span class="hour-label">'+pad(h)+':00</span><div class="hour-line"></div></div>';
    html+='<div class="activities-layer" id="actLayer"></div></div>';
    wrap.innerHTML=html;

    const layer=document.getElementById("actLayer");
    const rangeStart=DAY_START*60;

    if(!day.activities.length){
      const hint=document.createElement("div");
      hint.className="empty-hint"; hint.style.pointerEvents="auto";
      hint.textContent="Brak aktywności. Kliknij „Dodaj aktywność”.";
      wrap.querySelector(".timeline").appendChild(hint);
    }

    day.activities.forEach(act=>{
      let s=minutesOf(act.start), e=minutesOf(act.end); if(e<=s) e=s+30;
      const cs=Math.max(s,rangeStart), ce=Math.min(e,DAY_END*60+60);
      const top=(cs-rangeStart)/60*HOUR_PX;
      const height=Math.max((ce-cs)/60*HOUR_PX,22);
      const b=document.createElement("div");
      b.className="activity-block"; b.style.top=top+"px"; b.style.height=height+"px"; b.style.background=act.color;
      const bell = notifyShort(act.notify) ? ' · 🔔 '+notifyShort(act.notify) : '';
      b.innerHTML='<span class="act-name">'+escapeHtml(act.name)+'</span>'+
        '<span class="act-meta">'+act.start+'–'+act.end+' · '+act.cat+' · '+fmtDuration(s,e)+bell+'</span>'+
        '<span class="act-del" title="Usuń">×</span>';
      b.querySelector(".act-del").addEventListener("click",ev=>{
        ev.stopPropagation();
        if(confirm("Usunąć aktywność „"+act.name+"”?")){
          if(scheduled[act.id]){ clearTimeout(scheduled[act.id]); delete scheduled[act.id]; }
          const d=getDay(selectedKey);
          d.activities=d.activities.filter(a=>a.id!==act.id);
          saveData(); renderDay(document.getElementById("viewArea"));
        }
      });
      layer.appendChild(b);
    });
  }

  /* ====== UTIL ====== */
  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  /* ====== POWIADOMIENIA ====== */
  const scheduled = {};   // id aktywności -> timeoutId (by nie dublować)
  function requestNotifyPermission(){
    if("Notification" in window && Notification.permission==="default"){
      Notification.requestPermission();
    }
  }
  function fireNotify(act){
    const title="🔔 "+act.name;
    const body=act.start+"–"+act.end+" · "+act.cat;
    if("Notification" in window && Notification.permission==="granted"){
      try{ new Notification(title,{body}); return; }catch(e){}
    }
    // zapasowo: gdy brak zgody / wsparcia
    console.log("Przypomnienie:",title,body);
  }
  function scheduleNotifications(){
    const now=Date.now();
    const maxAhead=26*3600*1000; // planuj tylko zdarzenia w najbliższych ~26h
    for(const key in data){
      const acts=(data[key]&&data[key].activities)||[];
      acts.forEach(act=>{
        if(!act.notify) return;
        const dt=parseKey(key);
        const [h,m]=act.start.split(":").map(Number);
        dt.setHours(h,m,0,0);
        const trigger=dt.getTime()-Number(act.notify)*60000;
        const delay=trigger-now;
        if(delay>0 && delay<=maxAhead && !scheduled[act.id]){
          scheduled[act.id]=setTimeout(()=>{ fireNotify(act); delete scheduled[act.id]; }, delay);
        }
      });
    }
  }

    render();
  });

  document.getElementById("prevBtn").addEventListener("click",()=>{
    if(viewMode==="month") viewDate.setMonth(viewDate.getMonth()-1);
    else if(viewMode==="week") viewDate.setDate(viewDate.getDate()-7);
    else{ viewDate.setDate(viewDate.getDate()-1); selectedKey=keyOfDate(viewDate); }
    render();
  });
  document.getElementById("nextBtn").addEventListener("click",()=>{
    if(viewMode==="month") viewDate.setMonth(viewDate.getMonth()+1);
    else if(viewMode==="week") viewDate.setDate(viewDate.getDate()+7);
    else{ viewDate.setDate(viewDate.getDate()+1); selectedKey=keyOfDate(viewDate); }
    render();
  });
  document.getElementById("todayBtn").addEventListener("click",()=>{
    viewDate=new Date(); selectedKey=todayKey(); render();
  });

  /* ====== START ====== */

  // Obsługa skrótu ?view=today z manifest.json shortcuts
  if(new URLSearchParams(location.search).get('view')==='today'){
    viewDate=new Date(); selectedKey=todayKey(); viewMode='day';
  }

  render();
  scheduleNotifications();
})();

/* ====================================================
   PWA — Service Worker + Install Prompt
   (poza IIFE, by dostęp do globalnego scope)
   ==================================================== */
(function initPWA(){

  /* 1. Rejestracja Service Workera */
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' })
        .then(reg => {
          console.log('[SW] Zarejestrowany, scope:', reg.scope);
          // Sprawdź aktualizację przy każdym otwarciu
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
                console.log('[SW] Nowa wersja dostępna — odśwież stronę.');
              }
            });
          });
        })
        .catch(err => console.warn('[SW] Błąd rejestracji:', err));
    });
  }

  /* 2. Pasek instalacji PWA */
  const bar      = document.getElementById('pwaBar');
  const btnYes   = document.getElementById('pwaBarInstall');
  const btnNo    = document.getElementById('pwaBarDismiss');
  const badge    = document.getElementById('pwaBadge');
  let deferredPrompt = null;

  // Pokaż badge jeśli uruchomiono ze skrótu
  if(window.matchMedia('(display-mode: standalone)').matches ||
     window.navigator.standalone === true){
    badge.classList.add('show');
  }

  // Chrome / Edge / Android — beforeinstallprompt
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    // Nie pokazuj jeśli już w trybie standalone
    if(!window.matchMedia('(display-mode: standalone)').matches){
      bar.classList.remove('hidden');
    }
  });

  btnYes.addEventListener('click', async () => {
    if(!deferredPrompt) return;
    bar.classList.add('hidden');
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('[PWA] Wybór użytkownika:', outcome);
    deferredPrompt = null;
  });

  btnNo.addEventListener('click', () => {
    bar.classList.add('hidden');
    // Ukryj na 7 dni
    localStorage.setItem('pwa-dismissed', Date.now() + 7*24*3600*1000);
  });

  // Nie pokazuj jeśli użytkownik kliknął "Nie teraz" niedawno
  const dismissedUntil = Number(localStorage.getItem('pwa-dismissed') || 0);
  if(Date.now() < dismissedUntil){
    window.addEventListener('beforeinstallprompt', e => e.preventDefault(), { once: true });
  }

  // Po instalacji schowaj pasek
  window.addEventListener('appinstalled', () => {
    bar.classList.add('hidden');
    badge.classList.add('show');
    deferredPrompt = null;
    console.log('[PWA] Zainstalowano!');
  });

  /* 3. iOS Safari — ręczna instrukcja (iOS nie obsługuje beforeinstallprompt) */
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.navigator.standalone === true;
  const iosDismissed = Number(localStorage.getItem('pwa-ios-dismissed') || 0);

  if(isIOS && !isStandalone && Date.now() > iosDismissed){
    // Pokaż własny pasek z instrukcją dla iOS
    const iosBar = document.createElement('div');
    iosBar.className = 'pwa-install-bar';
    iosBar.style.background = '#1d4ed8';
    iosBar.innerHTML = `
      <div class="pwa-install-bar-text" style="flex:1">
        <span>📲 Aby zainstalować: dotknij <strong>Udostępnij</strong> →
              <strong>Dodaj do ekranu głównego</strong></span>
      </div>
      <div class="pwa-install-bar-actions">
        <button class="dismiss" id="iosDismiss">OK</button>
      </div>`;
    document.body.appendChild(iosBar);
    document.getElementById('iosDismiss').addEventListener('click', () => {
      iosBar.classList.add('hidden');
      localStorage.setItem('pwa-ios-dismissed', Date.now() + 14*24*3600*1000);
    });
  }

})();
</script>
